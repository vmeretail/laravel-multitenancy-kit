name: Run tests

on: workflow_call

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          composer-auth: ${{ secrets.COMPOSER_AUTH }}

      - name: Run tests
        run: ./vendor/bin/phpunit --colors=always
